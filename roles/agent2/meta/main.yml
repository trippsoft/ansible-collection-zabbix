---
galaxy_info:
  author: Jim Tarpley (@trippsc2)
  namespace: trippsc2
  role_name: agent2
  description: This role installs the Zabbix Agent 2 on a Linux or Windows system.
  license: MIT

  min_ansible_version: '2.16'

  platforms:
    - name: Debian
      versions:
        - trixie
    - name: EL
      versions:
        - '10'
        - '9'
        - '8'
    - name: Ubuntu
      versions:
        - resolute
        - noble
        - jammy
    - name: Windows
      versions:
        - all

collections:
  - ansible.posix
  - ansible.windows
  - chocolatey.chocolatey
  - community.general
  - community.windows

dependencies: []
